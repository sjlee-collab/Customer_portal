version: 1
frontend:
  phases:
    preBuild:
      commands: []
    build:
      commands:
        # 배포 버전 주입 — index.html의 __BUILD_INFO__ 자리에 빌드일(KST)과 커밋 7자리를 심는다.
        # 화면 사용자 메뉴 하단에 보이며, 캐시로 옛 파일을 보고 있는지 눈으로 가리는 용도다.
        # ⚠ Amplify buildspec 파서는 따옴표로 감싸지 않은 명령 안의 콜론+공백을 YAML 매핑으로
        #   잘못 읽어 빌드 전체를 malformed로 실패시킨다(2026-09-15에 실제로 배포 3건이 막혔다).
        #   PyYAML은 같은 파일을 통과시키므로 로컬 파싱 성공을 믿지 말고 각 명령을 작은따옴표로 감쌀 것.
        - 'SHA=$(echo "${AWS_COMMIT_ID:-unknown}" | cut -c1-7)'
        - 'BUILT=$(TZ=Asia/Seoul date +%Y-%m-%d)'
        # 릴리스 번호(SemVer)는 release.sh가 레포 루트 VERSION 파일에 남긴다. 빌드 환경에는
        # 태그가 안 보일 수 있어 파일로 읽는다. 파일이 없으면 날짜·커밋만 표기(기존 동작).
        - 'VER=$(cat VERSION 2>/dev/null || true)'
        - 'sed -i "s/__BUILD_INFO__/${VER:+v${VER} · }${BUILT} · ${SHA}/" index.html'
        # 주입이 실패해도 화면은 "미주입(로컬)"로 뜰 뿐이라 배포를 막지 않는다 — 빌드 로그에만 남긴다
        - 'if grep -q "__BUILD_INFO__" index.html; then echo "[경고] 버전 주입 실패 - 자리표시자가 남아 있습니다"; else echo "[버전 주입] ${VER:+v${VER} · }${BUILT} · ${SHA}"; fi'
  artifacts:
    baseDirectory: /
    files:
      - index.html
      - fonts/**
  cache:
    paths: []
